MOD_CBLISTMODULE="Community Builder list module"
MOD_CBLISTMODULE_XML_DESCRIPTION="Displays the users of a Community Builder list in a module, using a template with [fieldname] tags."
MOD_CBLISTMODULE_LAYOUT_DEFAULT="Default"

MOD_CBLISTMODULE_FIELD_LISTID_LABEL="CB list"
MOD_CBLISTMODULE_FIELD_LISTID_DESC="The published Community Builder list whose users are shown."
MOD_CBLISTMODULE_FIELD_USER_LIMIT_LABEL="Number of users to show"
MOD_CBLISTMODULE_FIELD_USER_LIMIT_DESC="Maximum number of users. Use 0 to show all users of the list."
MOD_CBLISTMODULE_FIELD_ORDERBY_LABEL="Order by field"
MOD_CBLISTMODULE_FIELD_ORDERBY_DESC="Field to order the users by. 'List default' uses the ordering configured in the CB list."
MOD_CBLISTMODULE_FIELD_SORTORDER_LABEL="Sort order"
MOD_CBLISTMODULE_FIELD_SORTORDER_DESC="Direction of the ordering. 'List default' uses the direction configured in the CB list."
MOD_CBLISTMODULE_OPTION_LIST_DEFAULT="List default"
MOD_CBLISTMODULE_OPTION_RANDOM="Random"
MOD_CBLISTMODULE_FIELD_COLUMNS_LABEL="Number of columns"
MOD_CBLISTMODULE_FIELD_COLUMNS_DESC="Fixed number of grid columns, or a responsive grid that fits as many columns as the minimum width allows."
MOD_CBLISTMODULE_OPTION_AUTOFIT="Responsive auto-fit"
MOD_CBLISTMODULE_FIELD_MINWIDTH_LABEL="Minimum column width (rem)"
MOD_CBLISTMODULE_FIELD_MINWIDTH_DESC="Minimum width of a column in rem."
MOD_CBLISTMODULE_FIELD_TEXT_ABOVE_LABEL="Text above the list"
MOD_CBLISTMODULE_FIELD_TEXT_ABOVE_DESC="HTML shown above the user list."
MOD_CBLISTMODULE_FIELD_TEMPLATE_LABEL="Template for each user"
MOD_CBLISTMODULE_FIELD_TEMPLATE_DESC="HTML shown once per user. Use [cb_fieldname] to insert a CB field, [id] or [user_id] for the user id, [profile_url] for the link to the CB profile and [site_url] for the site root. Tags matching a rule are replaced by the rule."
MOD_CBLISTMODULE_FIELD_ESCAPE_VALUES_LABEL="Escape field values"
MOD_CBLISTMODULE_FIELD_ESCAPE_VALUES_DESC="HTML-escape the values users entered in their profile before inserting them in the template. Keep this on unless your CB fields deliberately contain HTML, because turning it off lets users inject scripts into the page."
MOD_CBLISTMODULE_FIELD_RULES_LABEL="Rules"
MOD_CBLISTMODULE_FIELD_RULES_DESC="A rule replaces a tag with your own HTML, one version when the field has data and one when it is empty. A rule with the same name as a CB field wraps that field and can restrict who sees it. A rule with a new name creates a custom tag."
MOD_CBLISTMODULE_FIELD_RULE_TAG_NAME_LABEL="Tag name"
MOD_CBLISTMODULE_FIELD_RULE_TAG_NAME_DESC="Name of the tag without brackets, for example show_avatar or cb_city."
MOD_CBLISTMODULE_FIELD_RULE_ACCESSLEVEL_LABEL="Access level"
MOD_CBLISTMODULE_FIELD_RULE_ACCESSLEVEL_DESC="Only visitors with one of these access levels see the output of this rule. Leave empty for everybody."
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_LABEL="HTML when data is available"
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_DESC="HTML that replaces the tag when the field has a value. You can use other tags such as [name] inside it."
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_NO_LABEL="HTML when no data is available"
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_NO_DESC="HTML that replaces the tag when the field is empty or the image is not approved. Not used for custom tags."
MOD_CBLISTMODULE_FIELD_TEXT_BELOW_LABEL="Text below the list"
MOD_CBLISTMODULE_FIELD_TEXT_BELOW_DESC="HTML shown below the user list."
MOD_CBLISTMODULE_FIELD_DEBUG_LABEL="Debug output"
MOD_CBLISTMODULE_FIELD_DEBUG_DESC="Shows the generated SQL and warnings above the list. Only shown to logged in Super Users."
