MOD_CBLISTMODULE="Community Builder listmodul"
MOD_CBLISTMODULE_XML_DESCRIPTION="Visar användarna i en Community Builder-lista i en modul, med en mall som använder [fältnamn]-taggar."
MOD_CBLISTMODULE_LAYOUT_DEFAULT="Standard"

MOD_CBLISTMODULE_FIELD_LISTID_LABEL="CB-lista"
MOD_CBLISTMODULE_FIELD_LISTID_DESC="Den publicerade Community Builder-lista vars användare ska visas."
MOD_CBLISTMODULE_FIELD_USER_LIMIT_LABEL="Antal användare att visa"
MOD_CBLISTMODULE_FIELD_USER_LIMIT_DESC="Högsta antal användare. Ange 0 för att visa alla användare i listan."
MOD_CBLISTMODULE_FIELD_ORDERBY_LABEL="Sortera efter fält"
MOD_CBLISTMODULE_FIELD_ORDERBY_DESC="Fält som användarna sorteras efter. 'Listans standard' använder sorteringen i CB-listan."
MOD_CBLISTMODULE_FIELD_SORTORDER_LABEL="Sorteringsordning"
MOD_CBLISTMODULE_FIELD_SORTORDER_DESC="Sorteringsriktning. 'Listans standard' använder riktningen i CB-listan."
MOD_CBLISTMODULE_OPTION_LIST_DEFAULT="Listans standard"
MOD_CBLISTMODULE_OPTION_RANDOM="Slumpmässig"
MOD_CBLISTMODULE_FIELD_COLUMNS_LABEL="Antal kolumner"
MOD_CBLISTMODULE_FIELD_COLUMNS_DESC="Fast antal kolumner i rutnätet, eller ett responsivt rutnät som får plats med så många kolumner som minimibredden tillåter."
MOD_CBLISTMODULE_OPTION_AUTOFIT="Responsiv auto-fit"
MOD_CBLISTMODULE_FIELD_MINWIDTH_LABEL="Minsta kolumnbredd (rem)"
MOD_CBLISTMODULE_FIELD_MINWIDTH_DESC="Minsta bredd på en kolumn i rem."
MOD_CBLISTMODULE_FIELD_TEXT_ABOVE_LABEL="Text ovanför listan"
MOD_CBLISTMODULE_FIELD_TEXT_ABOVE_DESC="HTML som visas ovanför användarlistan."
MOD_CBLISTMODULE_FIELD_TEMPLATE_LABEL="Mall för varje användare"
MOD_CBLISTMODULE_FIELD_TEMPLATE_DESC="HTML som visas en gång per användare. Använd [cb_fältnamn] för ett CB-fält, [id] eller [user_id] för användar-id, [profile_url] för länken till CB-profilen och [site_url] för webbplatsens rot. Taggar som matchar en regel ersätts av regeln."
MOD_CBLISTMODULE_FIELD_ESCAPE_VALUES_LABEL="Escapa fältvärden"
MOD_CBLISTMODULE_FIELD_ESCAPE_VALUES_DESC="HTML-escapar de värden användarna själva skrivit in i sin profil innan de sätts in i mallen. Låt denna vara på om inte dina CB-fält medvetet innehåller HTML, eftersom avstängd låter användare injicera skript i sidan."
MOD_CBLISTMODULE_FIELD_RULES_LABEL="Regler"
MOD_CBLISTMODULE_FIELD_RULES_DESC="En regel ersätter en tagg med din egen HTML, en variant när fältet har data och en när det är tomt. En regel med samma namn som ett CB-fält omsluter fältet och kan begränsa vem som ser det. En regel med ett nytt namn skapar en egen tagg."
MOD_CBLISTMODULE_FIELD_RULE_TAG_NAME_LABEL="Taggnamn"
MOD_CBLISTMODULE_FIELD_RULE_TAG_NAME_DESC="Taggens namn utan hakparenteser, t.ex. show_avatar eller cb_city."
MOD_CBLISTMODULE_FIELD_RULE_ACCESSLEVEL_LABEL="Åtkomstnivå"
MOD_CBLISTMODULE_FIELD_RULE_ACCESSLEVEL_DESC="Bara besökare med någon av dessa åtkomstnivåer ser regelns utdata. Lämna tomt för alla."
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_LABEL="HTML när data finns"
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_DESC="HTML som ersätter taggen när fältet har ett värde. Du kan använda andra taggar som [name] inuti."
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_NO_LABEL="HTML när data saknas"
MOD_CBLISTMODULE_FIELD_RULE_HTMLCODE_NO_DESC="HTML som ersätter taggen när fältet är tomt eller bilden inte är godkänd. Används inte för egna taggar."
MOD_CBLISTMODULE_FIELD_TEXT_BELOW_LABEL="Text under listan"
MOD_CBLISTMODULE_FIELD_TEXT_BELOW_DESC="HTML som visas under användarlistan."
MOD_CBLISTMODULE_FIELD_DEBUG_LABEL="Felsökningsutskrift"
MOD_CBLISTMODULE_FIELD_DEBUG_DESC="Visar den genererade SQL-frågan och varningar ovanför listan. Visas bara för inloggade superanvändare."
